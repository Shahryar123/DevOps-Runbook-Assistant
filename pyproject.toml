[project]
name = "runbook-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shahryar", email = "muhammadshahryar135@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.6",
    "langchain-azure-ai>=1.2.10",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "openai>=3.33.0",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.0",
]

[project.scripts]
runbook-assistant = "runbook_assistant:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
