name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install dependencies
      # Installs the Python version from .python-version, the project itself
      # (src/runbook_assistant) and the dev group (pytest, ruff) from uv.lock.
      run: uv sync --locked
    - name: Lint with ruff
      run: uv run ruff check .
    - name: Test with pytest
      run: uv run pytest
